services:
  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      OLLAMA_BASE_URL: http://127.0.0.1:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:?Configura OLLAMA_MODEL nel .env}
    ports:
      - "5173:5173"
      - "8000:8000"
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ollama_data:/root/.ollama
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "python", "/app/docker/healthcheck.py"]
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 30m

volumes:
  postgres_data:
  ollama_data:
